name: Java Spring CI (Maven)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-syntax:
    name: Check cú pháp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Kiểm tra cú pháp (biên dịch code và test)
        run: mvn -B -q compile test-compile

  build-test-package:
    name: Build, Test, Package
    runs-on: ubuntu-latest
    needs: check-syntax
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build
        run: mvn -B clean compile

      - name: Chạy test
        run: mvn -B test

      - name: Upload báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Package
        run: mvn -B package -DskipTests

      - name: Upload file jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-api-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7