name: Java Spring CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check-syntax:
    name: Check cú pháp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tìm thư mục chứa pom.xml
        run: |
          POM_DIR=$(dirname "$(find . -name pom.xml -not -path '*/target/*' | head -n 1)")
          echo "POM_DIR=$POM_DIR" >> "$GITHUB_ENV"
          echo "Tìm thấy pom.xml tại: $POM_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Kiểm tra cú pháp (biên dịch code và test)
        working-directory: ${{ env.POM_DIR }}
        run: mvn -B -q compile test-compile

  build-test-package:
    name: Build, Test, Package
    runs-on: ubuntu-latest
    needs: check-syntax
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tìm thư mục chứa pom.xml
        run: |
          POM_DIR=$(dirname "$(find . -name pom.xml -not -path '*/target/*' | head -n 1)")
          echo "POM_DIR=$POM_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build
        working-directory: ${{ env.POM_DIR }}
        run: mvn -B clean compile

      - name: Chạy test
        working-directory: ${{ env.POM_DIR }}
        run: mvn -B test

      - name: Upload báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ${{ env.POM_DIR }}/target/surefire-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Package
        working-directory: ${{ env.POM_DIR }}
        run: mvn -B package -DskipTests

      - name: Upload file jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-api-jar
          path: ${{ env.POM_DIR }}/target/*.jar
          if-no-files-found: error
          retention-days: 7
